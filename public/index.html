<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BlinckyBill | Projectassistent</title>
<style>
:root{--bg:#111;--panel:#171717;--line:#39342e;--text:#f5f0e8;--muted:#b6b3ae;--gold:#d8b979;--gold2:#c9a56a;--bubble:#211f1c;--user:#3a2f20}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.page{min-height:100%;display:grid;place-items:center;padding:24px 16px}.page .card{width:100%;max-width:480px;height:min(680px,calc(100dvh - 48px));border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.card{display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
.embed .card{height:100dvh;border:0;border-radius:0}.embed .top{display:none}
.top{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.top strong{font-family:"Playfair Display",Georgia,serif;font-size:18px;color:var(--gold)}.top small{display:block;color:var(--muted);font-size:12px}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:3px 8px;white-space:nowrap}
#messages{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{font-size:14.5px;padding:10px 13px;max-width:88%;border-radius:14px;background:var(--bubble);white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--user);color:#fff3dc}.assistant{align-self:flex-start}.err{border:1px solid #6b3b2b}
.typing{color:var(--muted);font-style:italic}
.suggestions{display:flex;gap:6px;padding:8px 16px 0;flex-wrap:wrap}.suggestions button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:6px 10px;color:var(--text);font-size:12px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 16px}
textarea{flex:1;min-width:0;resize:none;height:44px;max-height:120px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#0f0f0f;color:var(--text);font:inherit;font-size:16px}
button[type=submit]{border:0;background:var(--gold);color:#111;border-radius:10px;padding:0 16px;font-weight:800;cursor:pointer;font-size:18px}
button:disabled{opacity:.5;cursor:wait}
.bottom{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:11.5px;align-items:center;color:var(--muted)}
.wa{background:#25d366;color:#fff;font-weight:800;text-decoration:none;border-radius:10px;padding:8px 12px;font-size:13px;white-space:nowrap}
a:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
<div class="page" id="root"><section class="card" aria-label="BlinckyBill chat">
<div class="top"><div><strong>BlinckyBill assistent</strong><small>Nederlands · English · Română</small></div><span class="badge" id="badge">AI-assistent</span></div>
<div id="messages" role="log" aria-live="polite" aria-label="Gesprek"></div>
<div class="suggestions"><button type="button">Ik wil een keuken laten monteren</button><button type="button">What does installation cost?</button><button type="button">Vreau o bucătărie montată</button></div>
<form><textarea id="input" aria-label="Uw bericht" maxlength="2000" placeholder="Waar kunnen we u mee helpen?" rows="1" required></textarea><button type="submit" aria-label="Bericht versturen">→</button></form>
<div class="bottom"><span>Prijzen en planning altijd persoonlijk bevestigd. Geen boeking via deze chat; deel geen gevoelige gegevens.</span><a class="wa" id="whatsapp" href="https://wa.me/31616698106" target="_blank" rel="noopener">WhatsApp ↗</a></div>
</section></div>
<script>
if(location.pathname==='/embed'||new URLSearchParams(location.search).has('embed'))document.body.className='embed',document.getElementById('root').className='';
const demoMode=location.protocol==='file:';// fixed answers only when opened locally, never on the hosted page
const history=[],log=document.querySelector('#messages'),input=document.querySelector('#input'),submit=document.querySelector('button[type=submit]'),form=document.querySelector('form');let busy=false;
function add(role,text,cls){const item=document.createElement('div');item.className='msg '+role+(cls?' '+cls:'');item.textContent=text;log.append(item);log.scrollTop=log.scrollHeight;return item;}
function updateLink(){const summary=history.filter(m=>m.role==='user').map(m=>m.content).join('\n').slice(-1500);document.querySelector('#whatsapp').href='https://wa.me/31616698106'+(summary?'?text='+encodeURIComponent('Hallo BlinckyBill, ik wil mijn project bespreken:\n'+summary):'');}
function demo(){return 'Demo zonder AI (lokaal bestand). Start de server voor echte antwoorden, of neem contact op via WhatsApp.';}
if(demoMode)document.getElementById('badge').textContent='Demo · geen AI';
add('assistant','Hallo! Ik ben de digitale assistent van BlinckyBill Keukens. Stel uw vraag over keukenmontage, renovatie, maatwerk of badkamermeubels. Prijzen en planning bevestigen we altijd persoonlijk via WhatsApp.\n\nYou can also write in English · Puteți scrie și în română.');
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||busy)return;busy=true;submit.disabled=true;input.value='';history.push({role:'user',content:text});add('user',text);updateLink();const wait=add('assistant','…','typing');
try{let reply;if(demoMode)reply=demo();else{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-15)}),signal:AbortSignal.timeout(25000)});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'AI niet bereikbaar. Neem contact op via WhatsApp.');reply=data.reply;}
wait.remove();history.push({role:'assistant',content:reply});add('assistant',reply);}
catch(err){wait.remove();history.pop();add('assistant',(err&&err.name==='TimeoutError')?'Geen antwoord ontvangen. Probeer opnieuw of gebruik WhatsApp.':(err.message||'Verbinding mislukt. Neem contact op via WhatsApp.'),'err');}
finally{busy=false;submit.disabled=false;input.focus();}};
document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{if(busy)return;input.value=b.textContent;form.requestSubmit();});
</script></html>
